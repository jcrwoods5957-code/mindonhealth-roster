<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1D9E75">
<title>Mind on Health · Staff Roster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 20 Q35 30 35 50 Q35 65 50 75 Q65 65 65 50 Q65 30 50 20 Z' fill='%231D9E75'/%3E%3Ccircle cx='50' cy='55' r='8' fill='%23378ADD'/%3E%3C/svg%3E">
<style>
:root{--bg:#f7f7f5;--bg-card:#fff;--bg-secondary:#f1efe8;--text:#1a1a1a;--text-muted:#6b6b6b;--text-faint:#999;--border:rgba(0,0,0,0.12);--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--danger:#A32D2D;--danger-light:#FCEBEB;--radius:8px;--radius-lg:12px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.container{max-width:1100px;margin:0 auto;padding:16px 20px 40px;}
header{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.logo{width:44px;height:44px;flex-shrink:0;}
.brand-title{font-size:17px;font-weight:600;margin:0;}
.brand-sub{font-size:13px;color:var(--text-muted);margin:0;}
.spacer{flex:1;}
.userbox{font-size:13px;color:var(--text-muted);text-align:right;}
.userbox b{color:var(--text);font-weight:600;display:block;}
.userbox a{color:var(--accent);text-decoration:none;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:10px 14px;cursor:pointer;font-size:14px;color:var(--text-muted);border:none;background:transparent;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}
.tab:hover:not(.active){color:var(--text);}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;}
.card-title{font-size:16px;font-weight:600;margin:0 0 14px;}
.roster-grid{display:grid;grid-template-columns:110px repeat(3,1fr);gap:6px;min-width:580px;}
.r-cell{background:var(--bg-secondary);border-radius:var(--radius);padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;transition:background 0.15s;}
.r-head{background:transparent;font-weight:600;min-height:32px;justify-content:center;}
.r-day{background:transparent;font-weight:600;font-size:13px;color:var(--text-muted);justify-content:center;}
.r-cell select{width:100%;font-size:12px;padding:4px 5px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);}
.r-times{display:flex;gap:4px;align-items:center;}
.r-times input[type=time]{flex:1;font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);}
.r-times span{font-size:11px;color:var(--text-muted);}
.r-name{font-weight:600;font-size:13px;}
.r-time{font-size:11px;color:var(--text-muted);}
.status-sl{background:#FFF3CD !important;}
.status-al{background:#DBEAFE !important;}
.status-off{background:#E5E7EB !important;}
.status-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle;}
.badge-sl{background:#D97706;color:white;}
.badge-al{background:#2563EB;color:white;}
.badge-off{background:#6B7280;color:white;}
.loc-pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;}
.loc-pk{background:#E6F1FB;color:#0C447C;}
.loc-ox{background:#EEEDFE;color:#3C3489;}
.loc-pim{background:#FAECE7;color:#993C1D;}
.row{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.label{font-size:13px;color:var(--text-muted);min-width:90px;}
.input,select.input,textarea.input{padding:8px 10px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text);font-family:inherit;outline:none;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,158,117,0.15);}
.btn{font-family:inherit;font-size:14px;padding:9px 14px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border);background:white;color:var(--text);}
.btn:hover{background:var(--bg-secondary);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:600;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-approve{color:var(--accent-dark);border-color:var(--accent);font-size:13px;padding:6px 12px;margin-right:6px;background:white;}
.btn-approve:hover{background:var(--accent-light);}
.btn-reject{color:var(--danger);border-color:#E24B4A;font-size:13px;padding:6px 12px;background:white;}
.btn-reject:hover{background:var(--danger-light);}
.btn-icon{padding:6px 10px;font-size:14px;}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
.pill-pending{background:#FAEEDA;color:#854F0B;}
.pill-approved{background:var(--accent-light);color:var(--accent-dark);}
.pill-rejected{background:var(--danger-light);color:var(--danger);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:8px 6px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl input,.tbl select{width:100%;padding:6px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);}
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.week-label{font-weight:600;font-size:14px;}
.admin-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.empty{text-align:center;color:var(--text-muted);font-size:14px;padding:30px;}
.stat{background:var(--bg-secondary);padding:14px;border-radius:var(--radius);}
.stat-label{font-size:12px;color:var(--text-muted);}
.stat-value{font-size:22px;font-weight:600;margin-top:2px;}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.flash{padding:12px 16px;background:var(--accent-light);color:var(--accent-dark);border-radius:var(--radius);margin-bottom:14px;font-size:14px;}
.error{padding:12px 16px;background:var(--danger-light);color:var(--danger);border-radius:var(--radius);margin-bottom:14px;font-size:14px;}
.loading{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
.login-wrap{max-width:400px;margin:50px auto;}
.login-wrap .card{padding:32px;}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:white;border-radius:var(--radius-lg);padding:24px 26px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-title{font-size:16px;font-weight:600;margin:0 0 16px;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);padding:0;line-height:1;}
.check-issue{font-size:13px;padding:4px 0 4px 12px;color:var(--text-muted);margin:0;}
.check-day{font-size:13px;font-weight:600;margin:10px 0 2px;}
#print-view{display:none;}
@media print{
  .container{display:none !important;}
  #print-view{display:block !important;font-family:Arial,sans-serif;color:#000;padding:20px;}
  #print-view h1{font-size:20px;margin:0 0 2px;color:#1D9E75;}
  #print-view h2{font-size:13px;font-weight:400;color:#555;margin:0 0 2px;}
  #print-view .print-meta{font-size:11px;color:#888;margin:0 0 16px;}
  #print-view table{width:100%;border-collapse:collapse;}
  #print-view th{background:#1D9E75;color:white;padding:8px 10px;text-align:left;font-size:11px;border:1px solid #1D9E75;}
  #print-view td{padding:8px 10px;border:1px solid #ccc;font-size:11px;vertical-align:top;}
  #print-view .p-sl{background:#FFF3CD;}
  #print-view .p-al{background:#DBEAFE;}
  #print-view .p-off{background:#E5E7EB;}
  #print-view .p-badge{font-weight:700;font-size:10px;margin-left:4px;}
  #print-view .p-badge-sl{color:#B45309;}
  #print-view .p-badge-al{color:#1D4ED8;}
  #print-view .p-badge-off{color:#4B5563;}
  #print-view .print-legend{margin-top:14px;font-size:10px;color:#666;border-top:1px solid #ddd;padding-top:8px;}
}
@media(max-width:640px){.container{padding:12px 14px 30px;}.tab{padding:8px 10px;font-size:13px;}}
</style>
</head>
<body>
<div class="container">
  <header>
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M50 20 Q35 30 35 50 Q35 65 50 75 Q65 65 65 50 Q65 30 50 20 Z" fill="#1D9E75" opacity="0.85"/>
      <circle cx="50" cy="55" r="8" fill="#378ADD"/>
      <path d="M30 70 Q40 60 50 65 Q60 70 70 70" stroke="#378ADD" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <p class="brand-title">Mind on Health</p>
      <p class="brand-sub">Staff roster &amp; timesheets</p>
    </div>
    <div class="spacer"></div>
    <div class="userbox" id="userbox"></div>
  </header>
  <main id="root"><div class="loading">Loading…</div></main>
</div>
<div id="print-view"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
// CONFIGURATION — replace these two values with your Supabase details
// =====================================================================
const SUPABASE_URL      = 'https://qurobfsxfmchmnjpxsqb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9x-EQBdr5mzHwV7JtKGLxQ_b8yq9atc';
// =====================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOCATIONS = ['Parkwood','Oxenford','Pimpama'];
const DAYS      = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

function getMonday(d){d=new Date(d);const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d.setDate(diff));m.setHours(0,0,0,0);return m;}
function fmtDate(d){return d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'});}
function isoDate(d){const tz=d.getTimezoneOffset()*60000;return new Date(d-tz).toISOString().slice(0,10);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function hoursBetween(start,end,breakMin){if(!start||!end)return 0;const[sh,sm]=start.split(':').map(Number);const[eh,em]=end.split(':').map(Number);const mins=(eh*60+em)-(sh*60+sm)-(breakMin||0);return Math.max(0,Math.round((mins/60)*100)/100);}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function staffById(id){return allStaff.find(s=>s.id===id);}
function t5(t){return t?t.slice(0,5):''}
function removeModal(id){const el=document.getElementById(id);if(el)el.remove();}

let state={user:null,profile:null,tab:'roster',weekStart:getMonday(new Date()),flash:null,error:null};
let allStaff=[];
const root=document.getElementById('root');
const userbox=document.getElementById('userbox');

// ---- AUTH ----
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session)await loadSession(session.user);else renderLogin();
  sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_OUT'){state.user=null;state.profile=null;renderLogin();}});
}
async function loadSession(user){
  state.user=user;
  const{data:profile}=await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  if(!profile){root.innerHTML=`<div class="card"><p class="card-title">Account not set up</p><p>Your sign-in worked but no staff profile was found. Ask Missy to set up your account.</p><button class="btn" onclick="logout()">Sign out</button></div>`;return;}
  state.profile=profile;
  const{data:staff}=await sb.from('staff').select('*').order('name');
  allStaff=staff||[];
  state.tab='roster';
  render();
}
async function logout(){await sb.auth.signOut();}

// ---- RENDER ----
function render(){
  if(!state.profile){renderLogin();return;}
  userbox.innerHTML=`<b>${esc(state.profile.name)}</b>${esc(state.profile.role)} · <a href="#" id="logout-link">Logout</a>`;
  document.getElementById('logout-link').onclick=(e)=>{e.preventDefault();logout();};
  const tabs=[{id:'roster',label:'Roster'},{id:'hours',label:'My hours'},{id:'requests',label:'Requests'}];
  if(state.profile.is_admin)tabs.push({id:'admin',label:'Admin'});
  let html='<div class="tabs">';
  tabs.forEach(t=>{html+=`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`;});
  html+='</div>';
  if(state.flash){html+=`<div class="flash">${esc(state.flash)}</div>`;state.flash=null;}
  if(state.error){html+=`<div class="error">${esc(state.error)}</div>`;state.error=null;}
  html+='<div id="tab-content"><div class="loading">Loading…</div></div>';
  root.innerHTML=html;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
  if(state.tab==='roster')renderRoster();
  else if(state.tab==='hours')renderHours();
  else if(state.tab==='requests')renderRequests();
  else if(state.tab==='admin')renderAdmin();
}

// ---- ROSTER TAB ----
async function renderRoster(){
  const tc=document.getElementById('tab-content');
  const weekKey=isoDate(state.weekStart);
  const{data:rows,error}=await sb.from('roster').select('*').eq('week_start',weekKey);
  if(error){tc.innerHTML=`<div class="error">Could not load roster: ${esc(error.message)}</div>`;return;}

  const map={};
  DAYS.forEach(d=>{map[d]={};LOCATIONS.forEach(l=>{map[d][l]={staff_id:null,status:'normal',start_time:'08:30',end_time:'17:00'};});});
  rows.forEach(r=>{if(map[r.day_of_week])map[r.day_of_week][r.location]={staff_id:r.staff_id,status:r.status||'normal',start_time:t5(r.start_time)||'08:30',end_time:t5(r.end_time)||'17:00'};});

  const endDate=addDays(state.weekStart,4);
  const isAdmin=state.profile.is_admin;

  let html=`<div class="week-nav">
    <button class="btn btn-icon" id="prev-wk">‹</button>
    <span class="week-label">Week of ${fmtDate(state.weekStart)} – ${fmtDate(endDate)}</span>
    <button class="btn btn-icon" id="next-wk">›</button>
    <button class="btn" id="this-wk" style="margin-left:auto;">This week</button>
    ${isAdmin?'<button class="btn" id="copy-prev-wk">Copy from previous week</button>':''}
  </div>
  ${isAdmin?`<div class="admin-actions">
    <button class="btn" id="check-roster">✓ Check Roster</button>
    <button class="btn" id="export-pdf">⬇ Export PDF</button>
  </div>`:''}`;

  html+=`<div class="card scroll-x"><div class="roster-grid">
    <div class="r-cell r-head"></div>
    <div class="r-cell r-head"><span class="loc-pill loc-pk">Parkwood</span></div>
    <div class="r-cell r-head"><span class="loc-pill loc-ox">Oxenford</span></div>
    <div class="r-cell r-head"><span class="loc-pill loc-pim">Pimpama</span></div>`;

  DAYS.forEach((day,i)=>{
    const date=addDays(state.weekStart,i);
    html+=`<div class="r-cell r-day">${day}<br><span style="font-size:11px;font-weight:400;">${fmtDate(date)}</span></div>`;
    LOCATIONS.forEach(loc=>{
      const cell=map[day][loc];
      const sid=cell.staff_id;
      const status=cell.status;
      const st=cell.start_time;
      const et=cell.end_time;
      const cellCls='r-cell'+(status!=='normal'?` status-${status}`:'');
      if(isAdmin){
        let staffOpts='<option value="">— empty —</option>';
        allStaff.filter(s=>!s.is_admin).forEach(s=>{staffOpts+=`<option value="${s.id}" ${sid===s.id?'selected':''}>${esc(s.name.split(' ')[0])}</option>`;});
        const stOpts=`<option value="normal" ${status==='normal'?'selected':''}>Working</option>
          <option value="sl" ${status==='sl'?'selected':''}>SL – Sick Leave</option>
          <option value="al" ${status==='al'?'selected':''}>AL – Annual Leave</option>
          <option value="off" ${status==='off'?'selected':''}>Off</option>`;
        html+=`<div class="${cellCls}">
          <select data-day="${day}" data-loc="${loc}" class="r-edit">${staffOpts}</select>
          <select data-day="${day}" data-loc="${loc}" class="r-status">${stOpts}</select>
          <div class="r-times">
            <input type="time" data-day="${day}" data-loc="${loc}" class="r-start" value="${st}"/>
            <span>–</span>
            <input type="time" data-day="${day}" data-loc="${loc}" class="r-end" value="${et}"/>
          </div>
        </div>`;
      } else {
        const s=sid?staffById(sid):null;
        const badge=status!=='normal'?`<span class="status-badge badge-${status}">${status.toUpperCase()}</span>`:'';
        html+=`<div class="${cellCls}">
          <div class="r-name">${s?esc(s.name.split(' ')[0]):'—'}${badge}</div>
          <div class="r-time">${s?`${st} – ${et}`:''}</div>
        </div>`;
      }
    });
  });
  html+=`</div>${isAdmin?'<p style="font-size:12px;color:var(--text-muted);margin-top:12px;">Changes save automatically. Set staff, status and hours for each cell.</p>':''}</div>`;
  tc.innerHTML=html;

  document.getElementById('prev-wk').onclick=()=>{state.weekStart=addDays(state.weekStart,-7);render();};
  document.getElementById('next-wk').onclick=()=>{state.weekStart=addDays(state.weekStart,7);render();};
  document.getElementById('this-wk').onclick=()=>{state.weekStart=getMonday(new Date());render();};
  if(!isAdmin)return;

  // save helper — always reads all 4 fields from DOM so nothing gets overwritten
  async function saveCell(day,loc){
    const stfSel=document.querySelector(`.r-edit[data-day="${day}"][data-loc="${loc}"]`);
    const stsSel=document.querySelector(`.r-status[data-day="${day}"][data-loc="${loc}"]`);
    const stIn=document.querySelector(`.r-start[data-day="${day}"][data-loc="${loc}"]`);
    const etIn=document.querySelector(`.r-end[data-day="${day}"][data-loc="${loc}"]`);
    const staff_id=stfSel?stfSel.value||null:null;
    const status=stsSel?stsSel.value:'normal';
    const start_time=stIn?stIn.value||'08:30':null;
    const end_time=etIn?etIn.value||'17:00':null;
    const{error}=await sb.from('roster').upsert(
      {week_start:weekKey,day_of_week:day,location:loc,staff_id,status,start_time,end_time,updated_at:new Date().toISOString()},
      {onConflict:'week_start,day_of_week,location'});
    if(error){state.error='Save failed: '+error.message;render();}
  }

  document.querySelectorAll('.r-edit').forEach(sel=>{sel.onchange=()=>saveCell(sel.dataset.day,sel.dataset.loc);});
  document.querySelectorAll('.r-status').forEach(sel=>{
    sel.onchange=()=>{
      const cell=sel.closest('.r-cell');
      cell.className='r-cell'+(sel.value!=='normal'?` status-${sel.value}`:'');
      saveCell(sel.dataset.day,sel.dataset.loc);
    };
  });
  document.querySelectorAll('.r-start,.r-end').forEach(inp=>{inp.onchange=()=>saveCell(inp.dataset.day,inp.dataset.loc);});

  // copy from previous week
  document.getElementById('copy-prev-wk').onclick=async(ev)=>{
    const prevWeekStart=addDays(state.weekStart,-7);
    const prevWeekKey=isoDate(prevWeekStart);
    const{data:prevRows,error:pErr}=await sb.from('roster').select('*').eq('week_start',prevWeekKey);
    if(pErr){state.error='Could not load previous week: '+pErr.message;render();return;}
    const validPrev=(prevRows||[]).filter(r=>r.staff_id);
    if(!validPrev.length){state.error='Previous week has no roster to copy from.';render();return;}
    const currentHasData=rows.some(r=>r.staff_id);
    if(currentHasData&&!confirm('This will overwrite the current week. Continue?'))return;
    const payload=validPrev.map(r=>({week_start:weekKey,day_of_week:r.day_of_week,location:r.location,staff_id:r.staff_id,status:r.status||'normal',start_time:t5(r.start_time)||'08:30',end_time:t5(r.end_time)||'17:00',updated_at:new Date().toISOString()}));
    ev.target.disabled=true;ev.target.textContent='Copying…';
    const{error:uErr}=await sb.from('roster').upsert(payload,{onConflict:'week_start,day_of_week,location'});
    ev.target.disabled=false;ev.target.textContent='Copy from previous week';
    if(uErr){state.error='Copy failed: '+uErr.message;render();return;}
    state.flash='Roster copied from week of '+fmtDate(prevWeekStart)+'.';
    render();
  };

  // check roster
  document.getElementById('check-roster').onclick=async()=>{
    const issues=[];
    DAYS.forEach(day=>{
      const dayRows=rows.filter(r=>r.day_of_week===day);
      LOCATIONS.forEach(loc=>{
        const locRow=dayRows.find(r=>r.location===loc);
        if(!locRow||!locRow.staff_id){issues.push({type:'uncovered',day,msg:`${loc} — no staff assigned`});}
        else if(['sl','al'].includes(locRow.status)){const nm=staffById(locRow.staff_id)?.name?.split(' ')[0]||'Staff';issues.push({type:'cover',day,msg:`${loc} — ${nm} is on ${locRow.status.toUpperCase()}, needs cover`});}
      });
      const assigned=dayRows.filter(r=>r.staff_id&&r.status!=='off');
      const ids=assigned.map(r=>r.staff_id);
      const seen=new Set(),dups=new Set();
      ids.forEach(id=>{seen.has(id)?dups.add(id):seen.add(id);});
      dups.forEach(id=>{const nm=staffById(id)?.name||'Unknown';const locs=assigned.filter(r=>r.staff_id===id).map(r=>r.location).join(' & ');issues.push({type:'double',day,msg:`${nm} is assigned to multiple sites (${locs})`});});
    });
    showCheckModal(issues);
  };

  document.getElementById('export-pdf').onclick=()=>showPrintModal(map);
}

// ---- CHECK MODAL ----
function showCheckModal(issues){
  const coverIssues=issues.filter(i=>i.type==='cover'||i.type==='uncovered');
  const doubleIssues=issues.filter(i=>i.type==='double');
  let body;
  if(!issues.length){
    body=`<div style="text-align:center;padding:20px;"><div style="font-size:40px;margin-bottom:8px;">✅</div><p style="font-weight:600;margin:0 0 4px;">All clear!</p><p style="color:var(--text-muted);font-size:13px;margin:0;">No conflicts found for the week of ${fmtDate(state.weekStart)}.</p></div>`;
  } else {
    body='';
    if(coverIssues.length){
      body+=`<p style="font-weight:600;color:var(--danger);margin:0 0 8px;">⚠ Locations needing cover (${coverIssues.length})</p>`;
      const byDay={};coverIssues.forEach(i=>{if(!byDay[i.day])byDay[i.day]=[];byDay[i.day].push(i.msg);});
      Object.entries(byDay).forEach(([day,msgs])=>{body+=`<p class="check-day">${day}</p>`;msgs.forEach(m=>{body+=`<p class="check-issue">• ${esc(m)}</p>`;});});
    }
    if(doubleIssues.length){
      body+=`<p style="font-weight:600;color:var(--danger);margin:${coverIssues.length?'16px':0} 0 8px;">⚠ Double-booked staff (${doubleIssues.length})</p>`;
      const byDay2={};doubleIssues.forEach(i=>{if(!byDay2[i.day])byDay2[i.day]=[];byDay2[i.day].push(i.msg);});
      Object.entries(byDay2).forEach(([day,msgs])=>{body+=`<p class="check-day">${day}</p>`;msgs.forEach(m=>{body+=`<p class="check-issue">• ${esc(m)}</p>`;});});
    }
  }
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="check-modal" onclick="if(event.target===this)removeModal('check-modal')"><div class="modal"><div style="display:flex;align-items:center;margin-bottom:14px;"><p class="modal-title" style="margin:0;flex:1;">Roster check</p><button class="modal-close" onclick="removeModal('check-modal')">✕</button></div>${body}<div style="text-align:right;margin-top:18px;"><button class="btn btn-primary" onclick="removeModal('check-modal')">Done</button></div></div></div>`);
}

// ---- PRINT ----
function showPrintModal(map){
  const defaultWeek=isoDate(state.weekStart);
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="print-modal" onclick="if(event.target===this)removeModal('print-modal')"><div class="modal"><div style="display:flex;align-items:center;margin-bottom:16px;"><p class="modal-title" style="margin:0;flex:1;">Export Roster PDF</p><button class="modal-close" onclick="removeModal('print-modal')">✕</button></div><div class="row"><label class="label">Week beginning</label><input type="date" id="print-week" class="input" value="${defaultWeek}" style="flex:1;"/></div><p style="font-size:12px;color:var(--text-muted);margin:4px 0 20px;">Shows Mon–Fri with staff names, rostered hours and status.</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn" onclick="removeModal('print-modal')">Cancel</button><button class="btn btn-primary" id="print-go">Print roster</button></div></div></div>`);
  document.getElementById('print-go').onclick=async()=>{
    const val=document.getElementById('print-week').value;
    if(!val){alert('Please select a week.');return;}
    const weekStart=getMonday(new Date(val+'T00:00:00'));
    const weekKey=isoDate(weekStart);
    removeModal('print-modal');
    const{data:printRows}=await sb.from('roster').select('*').eq('week_start',weekKey);
    const pmap={};
    DAYS.forEach(d=>{pmap[d]={};LOCATIONS.forEach(l=>{pmap[d][l]={staff_id:null,status:'normal',start_time:'08:30',end_time:'17:00'};});});
    (printRows||[]).forEach(r=>{if(pmap[r.day_of_week])pmap[r.day_of_week][r.location]={staff_id:r.staff_id,status:r.status||'normal',start_time:t5(r.start_time)||'08:30',end_time:t5(r.end_time)||'17:00'};});
    printRoster(weekStart,pmap);
  };
}
function printRoster(weekStart,pmap){
  const endDate=addDays(weekStart,4);
  let trows='';
  DAYS.forEach((day,i)=>{
    const date=addDays(weekStart,i);
    const dateStr=date.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short'});
    trows+=`<tr><td style="font-weight:600;white-space:nowrap;">${day}</td><td style="font-size:10px;white-space:nowrap;">${dateStr}</td>`;
    LOCATIONS.forEach(loc=>{
      const cell=pmap[day][loc];
      const s=cell.staff_id?staffById(cell.staff_id):null;
      const status=cell.status||'normal';
      const cls=status!=='normal'?` class="p-${status}"`:'';
      const badge=status!=='normal'?`<span class="p-badge p-badge-${status}"> [${status.toUpperCase()}]</span>`:'';
      const times=s?`<br><span style="font-size:10px;color:#666;">${cell.start_time} – ${cell.end_time}</span>`:'';
      trows+=`<td${cls}>${s?esc(s.name)+badge:'—'}${times}</td>`;
    });
    trows+=`</tr>`;
  });
  document.getElementById('print-view').innerHTML=`<h1>Mind on Health</h1><h2>Staff Roster</h2><p class="print-meta">Week beginning Monday ${fmtDate(weekStart)} – Friday ${fmtDate(endDate)} · Printed ${new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'long',year:'numeric'})}</p><table><thead><tr><th>Day</th><th>Date</th><th>Parkwood</th><th>Oxenford</th><th>Pimpama</th></tr></thead><tbody>${trows}</tbody></table><p class="print-legend">SL = Sick Leave · AL = Annual Leave · Off = Rostered Day Off</p>`;
  setTimeout(()=>window.print(),100);
}

// ---- MY HOURS TAB ----
async function renderHours(){
  const tc=document.getElementById('tab-content');
  const weekKey=isoDate(state.weekStart);
  const endDate=addDays(state.weekStart,4);
  const endKey=isoDate(endDate);
  const[rosterRes,hoursRes]=await Promise.all([
    sb.from('roster').select('*').eq('week_start',weekKey),
    sb.from('timesheet_entries').select('*').eq('staff_id',state.profile.id).gte('work_date',weekKey).lte('work_date',endKey)
  ]);
  if(rosterRes.error||hoursRes.error){tc.innerHTML=`<div class="error">Could not load: ${esc((rosterRes.error||hoursRes.error).message)}</div>`;return;}

  // rmap includes rostered location AND times
  const rmap={};
  rosterRes.data.forEach(r=>{
    if(r.staff_id===state.profile.id){
      rmap[r.day_of_week]={location:r.location,start_time:t5(r.start_time)||'08:30',end_time:t5(r.end_time)||'17:00'};
    }
  });
  const hmap={};hoursRes.data.forEach(h=>{hmap[h.work_date]=h;});

  let html=`<div class="week-nav">
    <button class="btn btn-icon" id="prev-wk">‹</button>
    <span class="week-label">Week of ${fmtDate(state.weekStart)} – ${fmtDate(endDate)}</span>
    <button class="btn btn-icon" id="next-wk">›</button>
    <button class="btn" id="this-wk" style="margin-left:auto;">This week</button>
  </div>`;
  html+=`<div class="card scroll-x"><table class="tbl"><thead><tr>
    <th style="width:100px;">Day</th><th style="width:120px;">Location</th><th style="width:95px;">Start</th><th style="width:95px;">End</th><th style="width:80px;">Break (min)</th><th style="width:70px;">Total</th><th>Notes</th>
  </tr></thead><tbody>`;
  let weekTotal=0;
  DAYS.forEach((day,i)=>{
    const date=addDays(state.weekStart,i);
    const dKey=isoDate(date);
    const h=hmap[dKey]||{};
    const rostered=rmap[day];
    const scheduledLoc=rostered?.location||'';
    const rosteredStart=rostered?.start_time||'08:30';
    const rosteredEnd=rostered?.end_time||'17:00';
    const start=h.start_time||(scheduledLoc?rosteredStart:'');
    const end=h.end_time||(scheduledLoc?rosteredEnd:'');
    const brk=h.break_minutes!=null?h.break_minutes:(scheduledLoc?30:0);
    const tot=hoursBetween(start,end,brk);
    weekTotal+=tot;
    let locOpts='<option value="">—</option>';
    LOCATIONS.forEach(loc=>{locOpts+=`<option value="${loc}" ${(h.location||scheduledLoc)===loc?'selected':''}>${loc}</option>`;});
    html+=`<tr data-day="${dKey}">
      <td>${day}<div style="font-size:11px;color:var(--text-muted);">${fmtDate(date)}</div></td>
      <td><select class="hrs-loc">${locOpts}</select></td>
      <td><input class="hrs-start" type="time" value="${start}"/></td>
      <td><input class="hrs-end" type="time" value="${end}"/></td>
      <td><input class="hrs-break" type="number" min="0" max="180" value="${brk}"/></td>
      <td class="hrs-total" style="font-weight:600;">${tot.toFixed(2)}</td>
      <td><input class="hrs-notes" type="text" value="${esc(h.notes||'')}" placeholder="optional"/></td>
    </tr>`;
  });
  html+=`</tbody></table><div style="display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;">
    <div class="stat" style="flex:1;min-width:160px;"><div class="stat-label">Week total</div><div class="stat-value" id="week-total">${weekTotal.toFixed(2)} hrs</div></div>
    <button class="btn btn-primary" id="save-hours">Save timesheet</button>
    <button class="btn" id="export-csv">Download Xero CSV</button>
  </div></div>`;
  tc.innerHTML=html;

  document.getElementById('prev-wk').onclick=()=>{state.weekStart=addDays(state.weekStart,-7);render();};
  document.getElementById('next-wk').onclick=()=>{state.weekStart=addDays(state.weekStart,7);render();};
  document.getElementById('this-wk').onclick=()=>{state.weekStart=getMonday(new Date());render();};

  function recalc(){let total=0;document.querySelectorAll('tbody tr').forEach(tr=>{const s=tr.querySelector('.hrs-start').value;const e=tr.querySelector('.hrs-end').value;const b=parseInt(tr.querySelector('.hrs-break').value)||0;const t=hoursBetween(s,e,b);tr.querySelector('.hrs-total').textContent=t.toFixed(2);total+=t;});document.getElementById('week-total').textContent=total.toFixed(2)+' hrs';}
  document.querySelectorAll('.hrs-start,.hrs-end,.hrs-break').forEach(el=>el.oninput=recalc);

  document.getElementById('save-hours').onclick=async(ev)=>{
    ev.target.disabled=true;ev.target.textContent='Saving…';
    const rowsOut=[];
    document.querySelectorAll('tbody tr').forEach(tr=>{rowsOut.push({staff_id:state.profile.id,work_date:tr.dataset.day,location:tr.querySelector('.hrs-loc').value||null,start_time:tr.querySelector('.hrs-start').value||null,end_time:tr.querySelector('.hrs-end').value||null,break_minutes:parseInt(tr.querySelector('.hrs-break').value)||0,notes:tr.querySelector('.hrs-notes').value||null,updated_at:new Date().toISOString()});});
    const{error}=await sb.from('timesheet_entries').upsert(rowsOut,{onConflict:'staff_id,work_date'});
    ev.target.disabled=false;ev.target.textContent='Save timesheet';
    if(error){state.error='Save failed: '+error.message;render();return;}
    state.flash='Timesheet saved for week of '+fmtDate(state.weekStart)+'.';
    render();
  };

  document.getElementById('export-csv').onclick=()=>{
    let csv='EmployeeName,Date,EarningsRate,Location,StartTime,EndTime,BreakMinutes,TotalHours,Notes\n';
    document.querySelectorAll('tbody tr').forEach(tr=>{const dKey=tr.dataset.day;const s=tr.querySelector('.hrs-start').value;const e=tr.querySelector('.hrs-end').value;const b=parseInt(tr.querySelector('.hrs-break').value)||0;const t=hoursBetween(s,e,b);const loc=tr.querySelector('.hrs-loc').value;const notes=(tr.querySelector('.hrs-notes').value||'').replace(/"/g,'""');if(t>0)csv+=`"${state.profile.name}","${dKey}","Ordinary Hours","${loc}","${s}","${e}","${b}","${t.toFixed(2)}","${notes}"\n`;});
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`timesheet_${state.profile.name.replace(/\s+/g,'_').toLowerCase()}_${weekKey}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };
}

  function syncRows(){const t=document.getElementById('req-type').value;document.getElementById('req-loc-row').style.display=(t==='location'||t==='roster')?'flex':'none';document.getElementById('req-swap-row').style.display=(t==='swap')?'flex':'none';}
  document.getElementById('req-type').onchange=syncRows;syncRows();
  document.getElementById('req-submit').onclick=async(ev)=>{
