<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1D9E75">
<title>Mind on Health · Staff Roster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 20 Q35 30 35 50 Q35 65 50 75 Q65 65 65 50 Q65 30 50 20 Z' fill='%231D9E75'/%3E%3Ccircle cx='50' cy='55' r='8' fill='%23378ADD'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f3;--bg-card:#fff;--bg-secondary:#f0ede6;--text:#1a1a1a;--text-muted:#6b6b6b;--text-faint:#aaa;--border:rgba(0,0,0,0.10);--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--danger:#C0392B;--danger-light:#FDEDEC;--warning:#E67E22;--warning-light:#FEF5EC;--radius:8px;--radius-lg:14px;--shadow-sm:0 1px 3px rgba(0,0,0,0.07);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.container{max-width:1200px;margin:0 auto;padding:16px 20px 40px;}
.app-header{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:18px;}
.logo{width:42px;height:42px;flex-shrink:0;}
.brand-title{font-size:17px;font-weight:700;margin:0;}
.brand-sub{font-size:12px;color:var(--text-muted);margin:0;}
.spacer{flex:1;}
.userbox{font-size:13px;color:var(--text-muted);text-align:right;}
.userbox b{color:var(--text);font-weight:600;display:block;font-size:14px;}
.userbox a{color:var(--accent);text-decoration:none;font-size:12px;}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);border:none;background:transparent;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
.tab:hover:not(.active){color:var(--text);}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.card-title{font-size:15px;font-weight:700;margin:0 0 14px;}
.card-subtitle{font-size:12px;color:var(--text-muted);margin:-10px 0 14px;}
.dash-header{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.dash-title{font-size:24px;font-weight:700;letter-spacing:-0.5px;margin:0 0 2px;}
.dash-period{font-size:13px;color:var(--text-muted);margin:0;}
.dash-week-nav{display:flex;gap:6px;margin-left:auto;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);}
.stat-card.warning{background:var(--warning-light);border-color:rgba(230,126,34,0.3);}
.stat-card.danger{background:var(--danger-light);border-color:rgba(192,57,43,0.25);}
.stat-card.accent{background:var(--accent);border-color:var(--accent);}
.stat-num{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-1px;}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:4px;}
.stat-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
.stat-card.accent .stat-num,.stat-card.accent .stat-label,.stat-card.accent .stat-sub{color:white;}
.stat-card.accent .stat-sub{color:rgba(255,255,255,0.75);}
.action-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.dash-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start;}
.cr-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cr-table{width:100%;border-collapse:collapse;min-width:500px;}
.cr-table th{padding:8px 10px;background:var(--bg-secondary);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left;}
.cr-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.cr-table tr:last-child td{border-bottom:none;}
.cr-day{font-weight:700;font-size:12px;}
.cr-date{font-size:10px;color:var(--text-muted);}
.cr-cell{display:flex;flex-direction:column;gap:3px;}
.cr-cell select{font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);width:100%;}
.cr-times{display:flex;gap:3px;align-items:center;}
.cr-times input[type=time]{flex:1;font-size:10px;padding:2px 3px;border:1px solid var(--border);border-radius:3px;background:white;min-width:0;}
.cr-times span{font-size:10px;color:var(--text-muted);}
.cr-sl{background:#FFF9E6;}.cr-al{background:#EBF5FF;}.cr-off{background:#F3F4F6;}.cr-empty{background:#FEF2F2;}
.hours-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.hours-row:last-child{border-bottom:none;}
.hours-name{font-weight:600;font-size:13px;min-width:120px;}
.hours-bar-wrap{flex:1;background:var(--bg-secondary);border-radius:20px;height:7px;overflow:hidden;}
.hours-bar{height:100%;background:var(--accent);border-radius:20px;}
.hours-val{font-size:13px;font-weight:700;color:var(--text);min-width:55px;text-align:right;}
.req-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:white;}
.req-item:last-child{margin-bottom:0;}
.req-name{font-weight:700;font-size:14px;}
.req-meta{font-size:12px;color:var(--text-muted);margin:2px 0 6px;}
.req-reason{font-size:13px;color:var(--text);margin-bottom:10px;font-style:italic;}
.req-actions{display:flex;gap:8px;}
.type-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:capitalize;background:var(--bg-secondary);color:var(--text-muted);}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.pill-pending{background:#FEF3C7;color:#92400E;}
.pill-approved{background:var(--accent-light);color:var(--accent-dark);}
.pill-rejected{background:var(--danger-light);color:var(--danger);}
.roster-grid{display:grid;grid-template-columns:110px repeat(3,1fr);gap:6px;min-width:560px;}
.r-cell{background:var(--bg-secondary);border-radius:var(--radius);padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;}
.r-head{background:transparent;font-weight:700;min-height:30px;justify-content:center;}
.r-day{background:transparent;font-weight:700;font-size:12px;color:var(--text-muted);}
.r-cell select{width:100%;font-size:12px;padding:4px 5px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);}
.r-times{display:flex;gap:4px;align-items:center;}
.r-times input[type=time]{flex:1;font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;background:white;min-width:0;}
.r-times span{font-size:11px;color:var(--text-muted);}
.r-name{font-weight:700;font-size:13px;}
.r-time{font-size:11px;color:var(--text-muted);}
.status-sl{background:#FFF3CD !important;}.status-al{background:#DBEAFE !important;}.status-off{background:#E5E7EB !important;}
.status-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle;}
.badge-sl{background:#D97706;color:white;}.badge-al{background:#2563EB;color:white;}.badge-off{background:#6B7280;color:white;}
.loc-pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:700;}
.loc-pk{background:#E6F1FB;color:#0C447C;}.loc-ox{background:#EEEDFE;color:#3C3489;}.loc-pim{background:#FAECE7;color:#993C1D;}
.row{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.label{font-size:13px;color:var(--text-muted);min-width:90px;}
.input,select.input,textarea.input{padding:9px 12px;font-size:14px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text);font-family:inherit;outline:none;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,158,117,0.12);}
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--radius);cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text);white-space:nowrap;}
.btn:hover{background:var(--bg-secondary);}.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent);}.btn-primary:hover{background:var(--accent-dark);}
.btn-sm{font-size:12px;padding:6px 12px;}
.btn-approve{color:var(--accent-dark);border-color:var(--accent);background:var(--accent-light);}.btn-approve:hover{background:var(--accent);color:white;}
.btn-reject{color:var(--danger);border-color:rgba(192,57,43,0.4);background:var(--danger-light);}.btn-reject:hover{background:var(--danger);color:white;border-color:var(--danger);}
.btn-icon{padding:7px 11px;font-size:15px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:10px 14px;font-weight:700;color:var(--text-muted);border-bottom:1.5px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:0.3px;}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl input,.tbl select{width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);}
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.week-label{font-weight:700;font-size:13px;}
.empty{text-align:center;color:var(--text-muted);font-size:14px;padding:24px;background:var(--bg-secondary);border-radius:var(--radius);}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.flash{padding:12px 16px;background:var(--accent-light);color:var(--accent-dark);border-radius:var(--radius);margin-bottom:14px;font-size:14px;font-weight:500;}
.error{padding:12px 16px;background:var(--danger-light);color:var(--danger);border-radius:var(--radius);margin-bottom:14px;font-size:14px;}
.loading{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
.login-wrap{max-width:400px;margin:50px auto;}.login-wrap .card{padding:32px;}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:white;border-radius:var(--radius-lg);padding:24px 28px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.28);}
.modal-title{font-size:17px;font-weight:700;margin:0 0 16px;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);padding:0;line-height:1;}
.check-issue{font-size:13px;padding:4px 0 4px 14px;color:var(--text-muted);margin:0;}
.check-day{font-size:13px;font-weight:700;margin:10px 0 2px;}
.staff-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.staff-card-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
.staff-card-header:hover{background:var(--bg-secondary);}
.staff-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.staff-card-name{font-weight:700;font-size:15px;}
.staff-card-role{font-size:12px;color:var(--text-muted);}
.staff-card-body{padding:0 18px 16px;border-top:1px solid var(--border);display:none;}
.staff-card-body.open{display:block;}
.staff-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;padding-top:14px;}
.staff-detail-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:2px;}
.staff-detail-value{font-size:13px;color:var(--text);}
#print-view{display:none;}
@media print{
  .container{display:none !important;}
  #print-view{display:block !important;font-family:Arial,sans-serif;color:#000;padding:24px;}
  #print-view h1{font-size:20px;margin:0 0 2px;color:#1D9E75;font-weight:700;}
  #print-view h2{font-size:13px;font-weight:400;color:#555;margin:0 0 2px;}
  #print-view .print-meta{font-size:11px;color:#888;margin:0 0 18px;}
  #print-view table{width:100%;border-collapse:collapse;}
  #print-view th{background:#1D9E75;color:white;padding:9px 11px;text-align:left;font-size:11px;border:1px solid #1D9E75;}
  #print-view td{padding:9px 11px;border:1px solid #ccc;font-size:11px;vertical-align:top;}
  #print-view .p-sl{background:#FFF3CD;}.p-al{background:#DBEAFE;}.p-off{background:#E5E7EB;}
  #print-view .p-badge{font-weight:700;font-size:10px;margin-left:4px;}
  #print-view .p-badge-sl{color:#B45309;}.p-badge-al{color:#1D4ED8;}.p-badge-off{color:#4B5563;}
  #print-view .print-legend{margin-top:16px;font-size:10px;color:#666;border-top:1px solid #ddd;padding-top:10px;}
}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}.stats-grid{grid-template-columns:repeat(2,1fr);}.staff-detail-grid{grid-template-columns:1fr;}}
@media(max-width:640px){.container{padding:12px 14px 30px;}.tab{padding:8px 12px;font-size:13px;}.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px;}.stat-num{font-size:24px;}.action-strip .btn{font-size:12px;padding:8px 12px;}.dash-week-nav{margin-left:0;width:100%;}.hours-name{min-width:90px;font-size:12px;}}
</style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M50 20 Q35 30 35 50 Q35 65 50 75 Q65 65 65 50 Q65 30 50 20 Z" fill="#1D9E75" opacity="0.9"/>
      <circle cx="50" cy="55" r="8" fill="#378ADD"/>
      <path d="M30 70 Q40 60 50 65 Q60 70 70 70" stroke="#378ADD" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <div><p class="brand-title">Mind on Health</p><p class="brand-sub">Staff roster &amp; timesheets</p></div>
    <div class="spacer"></div>
    <div class="userbox" id="userbox"></div>
  </header>
  <main id="root"><div class="loading">Loading...</div></main>
</div>
<div id="print-view"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://qurobfsxfmchmnjpxsqb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9x-EQBdr5mzHwV7JtKGLxQ_b8yq9atc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOCATIONS=['Parkwood','Oxenford','Pimpama'];
const DAYS=['Wednesday','Thursday','Friday','Monday','Tuesday'];
const DAY_OFFSETS=[0,1,2,5,6];
function getWednesday(d){d=new Date(d);const day=d.getDay();const db=day>=3?day-3:day+4;const m=new Date(d);m.setDate(m.getDate()-db);m.setHours(0,0,0,0);return m;}
function fmtDate(d){return d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'});}
function fmtFull(d){return d.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short'});}
function fmtDateLong(d){return d?new Date(d).toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}):'--';}
function isoDate(d){const tz=d.getTimezoneOffset()*60000;return new Date(d-tz).toISOString().slice(0,10);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function hoursBetween(s,e,b){if(!s||!e)return 0;const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);return Math.max(0,Math.round(((eh*60+em)-(sh*60+sm)-(b||0))/60*100)/100);}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function staffById(id){return allStaff.find(s=>s.id===id);}
function t5(t){return t?t.slice(0,5):'';}
function removeModal(id){const el=document.getElementById(id);if(el)el.remove();}
function payWeekLabel(ws){return 'Pay week  Wed '+fmtDate(ws)+' to Tue '+fmtDate(addDays(ws,6));}
function fortnightLabel(ws){return 'Fortnight  Wed '+fmtDate(ws)+' to Tue '+fmtDate(addDays(ws,13));}
function downloadCsv(csv,fn){const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}
function initials(name){return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
let state={user:null,profile:null,tab:'roster',weekStart:getWednesday(new Date()),flash:null,error:null};
let allStaff=[];
const root=document.getElementById('root');
const userbox=document.getElementById('userbox');
async function init(){
  const r=await sb.auth.getSession();
  if(r.data.session)await loadSession(r.data.session.user);else renderLogin();
  sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT'){state.user=null;state.profile=null;renderLogin();}});
}
async function loadSession(user){
  state.user=user;
  const r=await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  if(!r.data){root.innerHTML='<div class="card"><p class="card-title">Account not set up</p><p>Sign-in worked but no staff profile found.</p><button class="btn" onclick="logout()">Sign out</button></div>';return;}
  state.profile=r.data;
  const sr=await sb.from('staff').select('*').order('name');
  allStaff=sr.data||[];
  state.tab=r.data.is_admin?'dashboard':'roster';
  render();
}
async function logout(){await sb.auth.signOut();}
function render(){
  if(!state.profile){renderLogin();return;}
  userbox.innerHTML='<b>'+esc(state.profile.name)+'</b>'+esc(state.profile.role)+' &middot; <a href="#" id="ll">Sign out</a>';
  document.getElementById('ll').onclick=function(e){e.preventDefault();logout();};
  var tabs=[];
  if(state.profile.is_admin){tabs.push({id:'dashboard',label:'Dashboard'});tabs.push({id:'staff',label:'Staff'});}
  tabs.push({id:'roster',label:'Roster'},{id:'hours',label:'My hours'},{id:'requests',label:'Requests'});
  var html='<div class="tabs">';
  tabs.forEach(function(t){html+='<button class="tab '+(state.tab===t.id?'active':'')+'" data-tab="'+t.id+'">'+t.label+'</button>';});
  html+='</div>';
  if(state.flash){html+='<div class="flash">'+esc(state.flash)+'</div>';state.flash=null;}
  if(state.error){html+='<div class="error">'+esc(state.error)+'</div>';state.error=null;}
  html+='<div id="tc"><div class="loading">Loading...</div></div>';
  root.innerHTML=html;
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;render();};});
  if(state.tab==='dashboard')renderDashboard();
  else if(state.tab==='staff')renderStaff();
  else if(state.tab==='roster')renderRoster();
  else if(state.tab==='hours')renderHours();
  else if(state.tab==='requests')renderRequests();
}
async function renderDashboard(){
  var tc=document.getElementById('tc');
  var weekKey=isoDate(state.weekStart);
  var fortnightEnd=isoDate(addDays(state.weekStart,13));
  var results=await Promise.all([
    sb.from('roster').select('*').eq('week_start',weekKey),
    sb.from('requests').select('*').order('created_at',{ascending:true}),
    sb.from('timesheet_entries').select('*').gte('work_date',weekKey).lte('work_date',fortnightEnd)
  ]);
  var rows=results[0].data||[];
  var allReqs=results[1].data||[];
  var hrs=results[2].data||[];
  var map={};
  DAYS.forEach(function(d){map[d]={};LOCATIONS.forEach(function(l){map[d][l]={staff_id:null,status:'normal',start_time:'08:30',end_time:'17:00'};});});
  rows.forEach(function(r){if(map[r.day_of_week])map[r.day_of_week][r.location]={staff_id:r.staff_id,status:r.status||'normal',start_time:t5(r.start_time)||'08:30',end_time:t5(r.end_time)||'17:00'};});
  var pending=allReqs.filter(function(r){return r.status==='pending';});
  var recent=allReqs.filter(function(r){return r.status!=='pending';}).sort(function(a,b){return b.created_at.localeCompare(a.created_at);}).slice(0,5);
  var covered=rows.filter(function(r){return r.staff_id&&r.status!=='off';}).length;
  var onLeave=new Set(rows.filter(function(r){return ['sl','al'].includes(r.status);}).map(function(r){return r.staff_id;})).size;

    ev.target.disabled=true;ev.target.textContent='Creating...';
    try{
      var tmpClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

function renderLogin(){
  userbox.innerHTML='';
  root.innerHTML='<div class="login-wrap"><div class="card"><p class="brand-title" style="margin-bottom:4px;">Sign in</p><p class="brand-sub" style="margin-bottom:18px;">Use the email Missy set up for you.</p><div class="row"><label class="label">Email</label><input id="li-email" class="input" type="email" autocomplete="username" style="flex:1;min-width:180px;"/></div><div class="row"><label class="label">Password</label><input id="li-pass" class="input" type="password" autocomplete="current-password" style="flex:1;min-width:180px;"/></div><div id="li-err" style="color:var(--danger);font-size:13px;margin:6px 0 12px;min-height:18px;"></div><button class="btn btn-primary" id="li-btn" style="width:100%;padding:12px;">Sign in</button><p style="font-size:12px;color:var(--text-faint);margin-top:18px;text-align:center;">Forgot your password? Ask Missy to reset it.</p></div></div>';
  var btn=document.getElementById('li-btn');
  var submit=async function(){
    var email=document.getElementById('li-email').value.trim();var pass=document.getElementById('li-pass').value;var err=document.getElementById('li-err');err.textContent='';
    if(!email||!pass){err.textContent='Email and password required.';return;}
    btn.disabled=true;btn.textContent='Signing in...';
    var r=await sb.auth.signInWithPassword({email:email,password:pass});
    btn.disabled=false;btn.textContent='Sign in';
    if(r.error){err.textContent=r.error.message;return;}
    await loadSession(r.data.user);
  };
  btn.onclick=submit;
  document.getElementById('li-pass').onkeydown=function(e){if(e.key==='Enter')submit();};
}
init();
</script>
</body>
</html>
