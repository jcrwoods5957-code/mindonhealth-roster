<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1D9E75">
<title>Mind on Health · Staff Roster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 20 Q35 30 35 50 Q35 65 50 75 Q65 65 65 50 Q65 30 50 20 Z' fill='%231D9E75'/%3E%3Ccircle cx='50' cy='55' r='8' fill='%23378ADD'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f3;--bg-card:#fff;--bg-secondary:#f0ede6;--text:#1a1a1a;--text-muted:#6b6b6b;--text-faint:#aaa;--border:rgba(0,0,0,0.10);--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--danger:#C0392B;--danger-light:#FDEDEC;--warning:#E67E22;--warning-light:#FEF5EC;--radius:8px;--radius-lg:14px;--shadow-sm:0 1px 3px rgba(0,0,0,0.07);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.container{max-width:1200px;margin:0 auto;padding:16px 20px 40px;}
.app-header{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:18px;}
.logo{width:42px;height:auto;flex-shrink:0;}
.brand-title{font-size:17px;font-weight:700;margin:0;}
.brand-sub{font-size:12px;color:var(--text-muted);margin:0;}
.spacer{flex:1;}
.userbox{font-size:13px;color:var(--text-muted);text-align:right;}
.userbox b{color:var(--text);font-weight:600;display:block;font-size:14px;}
.userbox a{color:var(--accent);text-decoration:none;font-size:12px;}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);border:none;background:transparent;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
.tab:hover:not(.active){color:var(--text);}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.card-title{font-size:15px;font-weight:700;margin:0 0 14px;}
.card-subtitle{font-size:12px;color:var(--text-muted);margin:-10px 0 14px;}
.dash-header{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.dash-title{font-size:24px;font-weight:700;letter-spacing:-0.5px;margin:0 0 2px;}
.dash-period{font-size:13px;color:var(--text-muted);margin:0;}
.dash-week-nav{display:flex;gap:6px;margin-left:auto;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);}
.stat-card.warning{background:var(--warning-light);border-color:rgba(230,126,34,0.3);}
.stat-card.danger{background:var(--danger-light);border-color:rgba(192,57,43,0.25);}
.stat-card.accent{background:var(--accent);border-color:var(--accent);}
.stat-num{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-1px;}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:4px;}
.stat-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
.stat-card.accent .stat-num,.stat-card.accent .stat-label,.stat-card.accent .stat-sub{color:white;}
.stat-card.accent .stat-sub{color:rgba(255,255,255,0.75);}
.action-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.dash-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start;}
.cr-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cr-table{width:100%;border-collapse:collapse;min-width:560px;}
.cr-table th{padding:7px 10px;background:var(--bg-secondary);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left;}
.cr-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.cr-table tr:last-child td{border-bottom:none;}
.cr-week-sep td{background:var(--bg-secondary);padding:5px 10px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;}
.cr-day{font-weight:700;font-size:12px;}
.cr-date{font-size:10px;color:var(--text-muted);}
.cr-cell{display:flex;flex-direction:column;gap:6px;}
.slot-row{display:flex;flex-direction:column;gap:3px;padding:4px;border-radius:6px;background:rgba(255,255,255,0.5);position:relative;}
.slot-row.slot-empty{background:transparent;}
.slot-row select{font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);width:100%;}
.slot-times{display:flex;gap:3px;align-items:center;}
.slot-times input[type=time]{flex:1;font-size:10px;padding:2px 3px;border:1px solid var(--border);border-radius:3px;background:white;min-width:0;}
.slot-times span{font-size:10px;color:var(--text-muted);}
.slot-remove{position:absolute;top:2px;right:2px;background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;padding:0 2px;line-height:1;}
.slot-remove:hover{color:var(--danger);}
.add-extra-btn{font-size:10px;padding:3px 6px;border:1px dashed var(--border);border-radius:4px;background:transparent;color:var(--text-muted);cursor:pointer;width:100%;}
.add-extra-btn:hover{background:var(--bg-secondary);color:var(--text);}
.cr-sl{background:#FFF9E6;}.cr-al{background:#EBF5FF;}.cr-off{background:#F3F4F6;}.cr-empty{background:#FEF2F2;}
.hours-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.hours-row:last-child{border-bottom:none;}
.hours-name{font-weight:600;font-size:13px;min-width:120px;}
.hours-bar-wrap{flex:1;background:var(--bg-secondary);border-radius:20px;height:7px;overflow:hidden;}
.hours-bar{height:100%;background:var(--accent);border-radius:20px;}
.hours-val{font-size:13px;font-weight:700;color:var(--text);min-width:55px;text-align:right;}
.req-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:white;}
.req-item:last-child{margin-bottom:0;}
.req-name{font-weight:700;font-size:14px;}
.req-meta{font-size:12px;color:var(--text-muted);margin:2px 0 6px;}
.req-reason{font-size:13px;color:var(--text);margin-bottom:10px;font-style:italic;}
.req-actions{display:flex;gap:8px;}
.type-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:capitalize;background:var(--bg-secondary);color:var(--text-muted);}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.pill-pending{background:#FEF3C7;color:#92400E;}
.pill-approved{background:var(--accent-light);color:var(--accent-dark);}
.pill-rejected{background:var(--danger-light);color:var(--danger);}
.row{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.label{font-size:13px;color:var(--text-muted);min-width:90px;}
.input,select.input,textarea.input{padding:9px 12px;font-size:14px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text);font-family:inherit;outline:none;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,158,117,0.12);}
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--radius);cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text);white-space:nowrap;}
.btn:hover{background:var(--bg-secondary);}.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent);}.btn-primary:hover{background:var(--accent-dark);}
.btn-sm{font-size:12px;padding:6px 12px;}
.btn-approve{color:var(--accent-dark);border-color:var(--accent);background:var(--accent-light);}.btn-approve:hover{background:var(--accent);color:white;}
.btn-reject{color:var(--danger);border-color:rgba(192,57,43,0.4);background:var(--danger-light);}.btn-reject:hover{background:var(--danger);color:white;border-color:var(--danger);}
.btn-icon{padding:7px 11px;font-size:15px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:10px 14px;font-weight:700;color:var(--text-muted);border-bottom:1.5px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:0.3px;}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl input,.tbl select{width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:white;font-family:inherit;color:var(--text);}
.fn-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.fn-label{font-weight:700;font-size:13px;}
.empty{text-align:center;color:var(--text-muted);font-size:14px;padding:24px;background:var(--bg-secondary);border-radius:var(--radius);}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.flash{padding:12px 16px;background:var(--accent-light);color:var(--accent-dark);border-radius:var(--radius);margin-bottom:14px;font-size:14px;font-weight:500;}
.error{padding:12px 16px;background:var(--danger-light);color:var(--danger);border-radius:var(--radius);margin-bottom:14px;font-size:14px;}
.loading{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
.login-wrap{max-width:400px;margin:50px auto;}.login-wrap .card{padding:32px;}
.pw-wrap{position:relative;flex:1;min-width:180px;}.pw-wrap .input{width:100%;padding-right:56px;}.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:12px;font-weight:700;cursor:pointer;padding:5px 6px;}.pw-toggle:hover{color:var(--text);}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:white;border-radius:var(--radius-lg);padding:24px 28px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.28);}
.modal-title{font-size:17px;font-weight:700;margin:0 0 16px;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);padding:0;line-height:1;}
.check-issue{font-size:13px;padding:6px 0 6px 14px;color:var(--text-muted);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.check-day{font-size:13px;font-weight:700;margin:10px 0 2px;}
.staff-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.staff-card-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
.staff-card-header:hover{background:var(--bg-secondary);}
.staff-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.staff-card-name{font-weight:700;font-size:15px;}
.staff-card-role{font-size:12px;color:var(--text-muted);}
.staff-card-body{padding:0 18px 16px;border-top:1px solid var(--border);display:none;}
.staff-card-body.open{display:block;}
.staff-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;padding-top:14px;}
.staff-detail-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:2px;}
.staff-detail-value{font-size:13px;color:var(--text);}
#print-view{display:none;}
@media print{
  .container{display:none !important;}
  #print-view{display:block !important;font-family:Arial,sans-serif;color:#000;padding:24px;}
  #print-view h1{font-size:20px;margin:0 0 2px;color:#1D9E75;font-weight:700;}
  #print-view h2{font-size:13px;font-weight:400;color:#555;margin:0 0 2px;}
  #print-view .print-meta{font-size:11px;color:#888;margin:0 0 18px;}
  #print-view table{width:100%;border-collapse:collapse;}
  #print-view th{background:#1D9E75;color:white;padding:9px 11px;text-align:left;font-size:11px;border:1px solid #1D9E75;}
  #print-view td{padding:9px 11px;border:1px solid #ccc;font-size:11px;vertical-align:top;}
  #print-view .p-wk-sep{background:#f0ede6;font-weight:700;font-size:10px;color:#666;letter-spacing:0.4px;}
  #print-view .p-sl{background:#FFF3CD;}.p-al{background:#DBEAFE;}.p-off{background:#E5E7EB;}
  #print-view .p-badge{font-weight:700;font-size:10px;margin-left:4px;}
  #print-view .p-badge-sl{color:#B45309;}.p-badge-al{color:#1D4ED8;}.p-badge-off{color:#4B5563;}
  #print-view .print-legend{margin-top:16px;font-size:10px;color:#666;border-top:1px solid #ddd;padding-top:10px;}
}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}.stats-grid{grid-template-columns:repeat(2,1fr);}.staff-detail-grid{grid-template-columns:1fr;}}
@media(max-width:640px){.container{padding:12px 14px 30px;}.tab{padding:8px 12px;font-size:13px;}.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px;}.stat-num{font-size:24px;}.action-strip .btn{font-size:12px;padding:8px 12px;}.dash-week-nav{margin-left:0;width:100%;}.hours-name{min-width:90px;font-size:12px;}}
</style>
</head>

<script>
var SUPABASE_URL = 'https://qurobfsxfmchmnjpxsqb.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_9x-EQBdr5mzHwV7JtKGLxQ_b8yq9atc';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var LOCATIONS = ['Parkwood','Oxenford','Pimpama'];
var DAYS = ['Wednesday','Thursday','Friday','Monday','Tuesday'];
var DAY_OFFSETS = [0,1,2,5,6];
var FN_ANCHOR = new Date('2026-06-24T00:00:00');

function getWednesday(d){d=new Date(d);var day=d.getDay();var db=day>=3?day-3:day+4;var m=new Date(d);m.setDate(m.getDate()-db);m.setHours(0,0,0,0);return m;}
function getFortnightStart(d){var wed=getWednesday(d);var msPerFn=14*24*60*60*1000;var n=Math.floor((wed.getTime()-FN_ANCHOR.getTime())/msPerFn);return new Date(FN_ANCHOR.getTime()+n*msPerFn);}
function fmtDate(d){return d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'});}
function fmtFull(d){return d.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short'});}
function fmtDateLong(d){return d?new Date(d).toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}):'--';}
function isoDate(d){var tz=d.getTimezoneOffset()*60000;return new Date(d-tz).toISOString().slice(0,10);}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function hoursBetween(s,e,b){if(!s||!e)return 0;var sh=parseInt(s.split(':')[0]);var sm=parseInt(s.split(':')[1]);var eh=parseInt(e.split(':')[0]);var em=parseInt(e.split(':')[1]);return Math.max(0,Math.round(((eh*60+em)-(sh*60+sm)-(b||0))/60*100)/100);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function staffById(id){return allStaff.find(function(s){return s.id===id;});}
function t5(t){return t?t.slice(0,5):'';}
function removeModal(id){var el=document.getElementById(id);if(el)el.remove();}
function fnLabel(fs){return 'Fortnight  Wed '+fmtDate(fs)+' to Tue '+fmtDate(addDays(fs,13));}
function wkLabel(fs,w){return 'Week '+(w+1)+':  '+fmtDate(addDays(fs,w*7))+' to '+fmtDate(addDays(fs,w*7+6));}
function downloadCsv(csv,fn){var b=new Blob([csv],{type:'text/csv;charset=utf-8;'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}
function initials(name){return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}

function emptyMap(){
  var m = {};
  for(var w=0;w<2;w++){
    var wk='wk'+w; m[wk]={};
    DAYS.forEach(function(d){m[wk][d]={};LOCATIONS.forEach(function(l){m[wk][d][l]=[];});});
  }
  return m;
}
function fillMap(m, rows, fs){
  var wk1 = isoDate(fs);
  var wk2 = isoDate(addDays(fs,7));
  rows.forEach(function(r){
    var wk = r.week_start === wk1 ? 'wk0' : 'wk1';
    if(m[wk] && m[wk][r.day_of_week] && m[wk][r.day_of_week][r.location]){
      m[wk][r.day_of_week][r.location].push({
        staff_id: r.staff_id, status: r.status||'normal',
        start_time: t5(r.start_time)||'08:30', end_time: t5(r.end_time)||'17:00',
        slot: r.slot||0, double_approved: !!r.double_approved
      });
    }
  });
  for(var w=0;w<2;w++){
    DAYS.forEach(function(d){LOCATIONS.forEach(function(l){m['wk'+w][d][l].sort(function(a,b){return a.slot-b.slot;});});});
  }
}
async function loadFortnightRoster(fs){
  var wk1=isoDate(fs), wk2=isoDate(addDays(fs,7));
  var r = await sb.from('roster').select('*').gte('week_start',wk1).lte('week_start',wk2);
  return r.data||[];
}
async function saveSlot(wkKey, day, loc, slot){
  var stf = document.querySelector('.r-edit[data-wk="'+wkKey+'"][data-day="'+day+'"][data-loc="'+loc+'"][data-slot="'+slot+'"]');
  var sts = document.querySelector('.r-status[data-wk="'+wkKey+'"][data-day="'+day+'"][data-loc="'+loc+'"][data-slot="'+slot+'"]');
  var st  = document.querySelector('.r-start[data-wk="'+wkKey+'"][data-day="'+day+'"][data-loc="'+loc+'"][data-slot="'+slot+'"]');
  var et  = document.querySelector('.r-end[data-wk="'+wkKey+'"][data-day="'+day+'"][data-loc="'+loc+'"][data-slot="'+slot+'"]');
  await sb.from('roster').upsert({
    week_start: wkKey, day_of_week: day, location: loc, slot: slot,
    staff_id: (stf?stf.value:null)||null,
    status: (sts?sts.value:'normal')||'normal',
    start_time: (st?st.value:'08:30')||'08:30',
    end_time: (et?et.value:'17:00')||'17:00',
    double_approved: false,
    updated_at: new Date().toISOString()
  },{onConflict:'week_start,day_of_week,location,slot'});
}
async function removeSlot(wkKey, day, loc, slot){
  await sb.from('roster').delete().eq('week_start',wkKey).eq('day_of_week',day).eq('location',loc).eq('slot',slot);
}
async function approveDouble(wkKey, day, staffId){
  await sb.from('roster').update({double_approved:true}).eq('week_start',wkKey).eq('day_of_week',day).eq('staff_id',staffId);
}

var state = {user:null, profile:null, tab:'roster', fnStart:getFortnightStart(new Date()), flash:null, error:null};
var allStaff = [];
var root = document.getElementById('root');
var userbox = document.getElementById('userbox');

async function init(){
  var r = await sb.auth.getSession();
  if(r.data.session) await loadSession(r.data.session.user); else renderLogin();
  sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT'){state.user=null;state.profile=null;renderLogin();}});
}
async function loadSession(user){
  state.user = user;
  var r = await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  if(!r.data){root.innerHTML='<div class="card"><p class="card-title">Account not set up</p><p>Sign-in worked but no staff profile found.</p><button class="btn" onclick="logout()">Sign out</button></div>';return;}
  state.profile = r.data;
  var sr = await sb.from('staff').select('*').order('name');
  allStaff = (sr.data||[]).filter(function(s){ return !s.is_webmaster && s.is_active!==false; });
  state.tab = r.data.is_admin ? 'dashboard' : 'roster';
  render();
}
async function logout(){await sb.auth.signOut();}

function render(){
  if(!state.profile){renderLogin();return;}
  userbox.innerHTML = '<b>'+esc(state.profile.name)+'</b>'+esc(state.profile.role)+' &middot; <a href="#" id="chpw">Change password</a> &middot; <a href="#" id="ll">Sign out</a>';
  document.getElementById('ll').onclick = function(e){e.preventDefault();logout();};
  document.getElementById('chpw').onclick = function(e){e.preventDefault();showChangePasswordModal();};
  var tabs = [];
  if(state.profile.is_admin){tabs.push({id:'dashboard',label:'Dashboard'});tabs.push({id:'staff',label:'Staff'});}
  tabs.push({id:'roster',label:'Roster'},{id:'hours',label:'My hours'},{id:'requests',label:'Requests'});
  var html = '<div class="tabs">';
  tabs.forEach(function(t){html+='<button class="tab '+(state.tab===t.id?'active':'')+'" data-tab="'+t.id+'">'+t.label+'</button>';});
  html += '</div>';
  if(state.flash){html+='<div class="flash">'+esc(state.flash)+'</div>';state.flash=null;}
  if(state.error){html+='<div class="error">'+esc(state.error)+'</div>';state.error=null;}
  html += '<div id="tc"><div class="loading">Loading...</div></div>';
  root.innerHTML = html;
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;render();};});
  if(state.tab==='dashboard') renderDashboard();
  else if(state.tab==='staff') renderStaff();
  else if(state.tab==='roster') renderRoster();
  else if(state.tab==='hours') renderHours();
  else if(state.tab==='requests') renderRequests();
}

// Build the roster table rows (used by both Dashboard and Roster tab)
function buildRosterRows(map, fs, isAdmin, onRefresh){
  var html = '';
  for(var w=0;w<2;w++){
    var wk = 'wk'+w;
    var wkStart = addDays(fs, w*7);
    var wkKey = isoDate(wkStart);
    html += '<tr class="cr-week-sep"><td colspan="4">'+wkLabel(fs,w)+'</td></tr>';
    DAYS.forEach(function(day,i){
      var date = addDays(wkStart, DAY_OFFSETS[i]);
      html += '<tr><td><div class="cr-day">'+day+'</div><div class="cr-date">'+fmtDate(date)+'</div></td>';
      LOCATIONS.forEach(function(loc){
        var arr = map[wk][day][loc];
        var active = arr.filter(function(a){return a.staff_id && a.status!=='off';});
        var tdCls = active.length===0 ? 'cr-empty' : '';
        html += '<td class="'+tdCls+'"><div class="cr-cell">';
        var displayArr = arr.length ? arr : [{staff_id:null,status:'normal',start_time:'08:30',end_time:'17:00',slot:0}];
        if(isAdmin){
          displayArr.forEach(function(item){
            var sOpts = '<option value="">-- empty --</option>';
            allStaff.forEach(function(s){sOpts+='<option value="'+s.id+'"'+(item.staff_id===s.id?' selected':'')+'>'+esc(s.name.split(' ')[0])+'</option>';});
            var stOpts = '<option value="normal"'+(item.status==='normal'?' selected':'')+'>Working</option>';
            stOpts += '<option value="sl"'+(item.status==='sl'?' selected':'')+'>SL</option>';
            stOpts += '<option value="al"'+(item.status==='al'?' selected':'')+'>AL</option>';
            stOpts += '<option value="off"'+(item.status==='off'?' selected':'')+'>Off</option>';
            var rowCls = 'slot-row'+(!item.staff_id?' slot-empty':'');
            html += '<div class="'+rowCls+'">';
            if(item.staff_id){
              html += '<button class="slot-remove" data-wk="'+wkKey+'" data-day="'+day+'" data-loc="'+loc+'" data-slot="'+item.slot+'" title="Remove">&#x2715;</button>';
            }
            html += '<select data-wk="'+wkKey+'" data-day="'+day+'" data-loc="'+loc+'" data-slot="'+item.slot+'" class="r-edit">'+sOpts+'</select>';
            html += '<select data-wk="'+wkKey+'" data-day="'+day+'" data-loc="'+loc+'" data-slot="'+item.slot+'" class="r-status">'+stOpts+'</select>';
            html += '<div class="slot-times"><input type="time" data-wk="'+wkKey+'" data-day="'+day+'" data-loc="'+loc+'" data-slot="'+item.slot+'" class="r-start" value="'+item.start_time+'"/><span>-</span>';
            html += '<input type="time" data-wk="'+wkKey+'" data-day="'+day+'" data-loc="'+loc+'" data-slot="'+item.slot+'" class="r-end" value="'+item.end_time+'"/></div>';
            html += '</div>';
          });
          var maxSlot = arr.length ? Math.max.apply(null, arr.map(function(a){return a.slot;})) : -1;
          var nextSlot = maxSlot + 1;
          html += '<button class="add-extra-btn" data-wk="'+wkKey+'" data-day="'+day+'" data-loc="'+loc+'" data-next-slot="'+nextSlot+'">+ Add extra staff</button>';
        } else {
          var any = false;
          displayArr.forEach(function(item){
            if(!item.staff_id) return;
            any = true;
            var s = staffById(item.staff_id);
            var badge = item.status!=='normal' ? '<span class="status-badge badge-'+item.status+'">'+item.status.toUpperCase()+'</span>' : '';
            html += '<div style="font-size:12px;margin-bottom:2px;"><strong>'+(s?esc(s.name.split(' ')[0]):'?')+'</strong>'+badge+'<br><span style="color:var(--text-muted);font-size:11px;">'+item.start_time+' - '+item.end_time+'</span></div>';
          });

// ════════ CHECK ROSTER (standalone, re-usable for refresh after approve) ════════
async function checkRoster(fs){
  var freshRows = await loadFortnightRoster(fs);
  var freshMap = emptyMap();
  fillMap(freshMap, freshRows, fs);
  var issues = [];
  for(var w=0;w<2;w++){
    var wkStart = addDays(fs, w*7);
    var wkKey = isoDate(wkStart);
    DAYS.forEach(function(day){
      LOCATIONS.forEach(function(loc){
        var arr = freshMap['wk'+w][day][loc];
        var active = arr.filter(function(a){return a.staff_id && a.status!=='off';});
        if(active.length===0){
          issues.push({type:'u', label:wkLabel(fs,w)+' '+day, msg: loc+' -- no staff assigned'});
        }
        active.forEach(function(a){
          if(['sl','al'].includes(a.status)){
            var nm=(staffById(a.staff_id)||{name:'Staff'}).name.split(' ')[0];
            issues.push({type:'c', label:wkLabel(fs,w)+' '+day, msg: loc+' -- '+nm+' on '+a.status.toUpperCase()+' needs cover'});
          }
        });
      });
      var allActive = [];
      LOCATIONS.forEach(function(loc){
        freshMap['wk'+w][day][loc].forEach(function(a){
          if(a.staff_id && a.status!=='off') allActive.push({staff_id:a.staff_id, loc:loc, double_approved:a.double_approved});
        });
      });
      var byStaff = {};
      allActive.forEach(function(a){if(!byStaff[a.staff_id])byStaff[a.staff_id]=[];byStaff[a.staff_id].push(a);});
      Object.keys(byStaff).forEach(function(staffId){
        var entries = byStaff[staffId];
        var distinctLocs = entries.map(function(e){return e.loc;}).filter(function(v,i,arr){return arr.indexOf(v)===i;});
        if(distinctLocs.length>1){
          var allApproved = entries.every(function(e){return e.double_approved;});
          if(!allApproved){
            var nm=(staffById(staffId)||{name:'?'}).name;
            issues.push({type:'d', label:wkLabel(fs,w)+' '+day, msg: nm+' double-booked ('+distinctLocs.join(' & ')+')', weekKey:wkKey, day:day, staffId:staffId});
          }
        }
      });
    });
  }
  showCheckModal(issues, fs);
}
function showCheckModal(issues, fs){
  removeModal('check-modal');
  var body = '';
  if(!issues.length){
    body = '<div style="text-align:center;padding:20px;"><div style="font-size:44px;margin-bottom:10px;">&#9989;</div><p style="font-weight:700;margin:0 0 4px;font-size:16px;">All clear!</p><p style="color:var(--text-muted);font-size:13px;margin:0;">No conflicts for this fortnight.</p></div>';
  } else {
    var byDay = {};
    issues.forEach(function(i){if(!byDay[i.label])byDay[i.label]=[];byDay[i.label].push(i);});
    Object.keys(byDay).forEach(function(day){
      body += '<p class="check-day">'+esc(day)+'</p>';
      byDay[day].forEach(function(i){
        body += '<p class="check-issue"><span>'+esc(i.msg)+'</span>';
        if(i.type==='d'){
          body += '<button class="btn btn-sm approve-double-btn" data-wk="'+i.weekKey+'" data-day="'+i.day+'" data-staff="'+i.staffId+'">Accept double-up</button>';
        }
        body += '</p>';
      });
    });
  }
  document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="check-modal" onclick="if(event.target===this)removeModal(\'check-modal\')"><div class="modal"><div style="display:flex;align-items:center;margin-bottom:14px;"><p class="modal-title" style="margin:0;flex:1;">Roster check</p><button class="modal-close" onclick="removeModal(\'check-modal\')">&#x2715;</button></div>'+body+'<div style="text-align:right;margin-top:18px;"><button class="btn btn-primary" onclick="removeModal(\'check-modal\')">Done</button></div></div></div>');
  document.querySelectorAll('.approve-double-btn').forEach(function(btn){
    btn.onclick = async function(){
      btn.disabled=true;btn.textContent='Accepting...';
      await approveDouble(btn.dataset.wk, btn.dataset.day, btn.dataset.staff);
      checkRoster(fs);
    };
  });
}

function showAddStaffModal(){
  var formHtml='<p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin:0 0 10px;">Login account</p><div class="row"><label class="label">Email</label><input id="ns-login-email" class="input" type="email" style="flex:1;" placeholder="staff@example.com"/></div><div class="row"><label class="label">Temp password</label><input id="ns-login-pass" class="input" type="text" style="flex:1;" placeholder="Min 6 characters"/></div><hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">'+buildStaffForm('ns',null);
  document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="staff-modal" onclick="if(event.target===this)removeModal(\'staff-modal\')"><div class="modal"><div style="display:flex;align-items:center;margin-bottom:16px;"><p class="modal-title" style="margin:0;flex:1;">Add New Staff Member</p><button class="modal-close" onclick="removeModal(\'staff-modal\')">&#x2715;</button></div>'+formHtml+'<div id="staff-modal-err" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0;"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;"><button class="btn" onclick="removeModal(\'staff-modal\')">Cancel</button><button class="btn btn-primary" id="save-new-staff">Create staff member</button></div></div></div>');
  document.getElementById('save-new-staff').onclick=async function(ev){
    var errEl=document.getElementById('staff-modal-err');
    var loginEmail=document.getElementById('ns-login-email').value.trim();
    var loginPass=document.getElementById('ns-login-pass').value;
    var data=getFormData('ns');
    if(!loginEmail||!loginPass||!data.name){errEl.textContent='Email, password and name are required.';return;}
    if(loginPass.length<6){errEl.textContent='Password must be at least 6 characters.';return;}
    ev.target.disabled=true;ev.target.textContent='Creating...';
    try{
      var tmpClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      // Name/role/admin are sent as signup metadata so the database trigger
      // sets them the instant the account is created - no race condition.
      var su=await tmpClient.auth.signUp({
        email:loginEmail, password:loginPass,
        options:{ data:{ name:data.name, role:data.role, is_admin:data.is_admin } }
      });
      if(su.error)throw su.error;
      if(!su.data.user)throw new Error('Account creation failed. Check the email is not already in use.');
      data.id=su.data.user.id;if(!data.email)data.email=loginEmail;
      // Wait for the profile row to exist before writing the remaining fields
      var found=false;
      for(var attempt=0; attempt<10; attempt++){
        var check = await sb.from('staff').select('id').eq('id',data.id).maybeSingle();
        if(check.data){ found=true; break; }
        await new Promise(function(resolve){ setTimeout(resolve, 400); });
      }
      if(!found){
        state.flash=data.name+' created and can log in now. Add their remaining details from the Staff list in a moment.';
        removeModal('staff-modal');renderStaff();return;
      }
      var up = await sb.from('staff').update({
        email:data.email, phone:data.phone, date_of_birth:data.date_of_birth,
        address:data.address, commencement_date:data.commencement_date,
        emergency_contact_name:data.emergency_contact_name, emergency_contact_phone:data.emergency_contact_phone
      }).eq('id',data.id);
      if(up.error)throw up.error;
      var sr=await sb.from('staff').select('*').order('name');allStaff=(sr.data||[]).filter(function(s){return !s.is_webmaster && s.is_active!==false;});
      removeModal('staff-modal');state.flash=data.name+' created. Login: '+loginEmail;renderStaff();
    }catch(e){ev.target.disabled=false;ev.target.textContent='Create staff member';errEl.textContent=e.message||'Failed to create account.';}
  };
}
function showEditStaffModal(staffId){
  var s=staffById(staffId);if(!s)return;
  var formHtml=buildStaffForm('es',s)+'<p style="font-size:11px;color:var(--text-faint);margin:10px 0 4px;">To reset login password: Supabase &rarr; Authentication &rarr; Users.</p>';
  document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="staff-modal" onclick="if(event.target===this)removeModal(\'staff-modal\')"><div class="modal"><div style="display:flex;align-items:center;margin-bottom:16px;"><p class="modal-title" style="margin:0;flex:1;">Edit &mdash; '+esc(s.name)+'</p><button class="modal-close" onclick="removeModal(\'staff-modal\')">&#x2715;</button></div>'+formHtml+'<div id="staff-modal-err" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0;"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;"><button class="btn" onclick="removeModal(\'staff-modal\')">Cancel</button><button class="btn btn-primary" id="save-edit-staff">Save changes</button></div></div></div>');

    ev.target.disabled=true;ev.target.textContent='Saving...';

function showChangePasswordModal(){
  document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="pw-modal" onclick="if(event.target===this)removeModal(\'pw-modal\')"><div class="modal"><div style="display:flex;align-items:center;margin-bottom:16px;"><p class="modal-title" style="margin:0;flex:1;">Change Password</p><button class="modal-close" onclick="removeModal(\'pw-modal\')">&#x2715;</button></div><div class="row"><label class="label">Current password</label><input id="pw-current" class="input" type="password" style="flex:1;" placeholder="Your current password"/></div><div class="row"><label class="label">New password</label><input id="pw-new" class="input" type="password" style="flex:1;" placeholder="Min 6 characters"/></div><div class="row"><label class="label">Confirm new</label><input id="pw-confirm" class="input" type="password" style="flex:1;"/></div><div id="pw-err" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0;"></div><div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn" onclick="removeModal(\'pw-modal\')">Cancel</button><button class="btn btn-primary" id="pw-save">Update password</button></div></div></div>');
  document.getElementById('pw-save').onclick = async function(ev){
    var errEl = document.getElementById('pw-err');
    var current = document.getElementById('pw-current').value;
    var newPw   = document.getElementById('pw-new').value;
    var confirmPw = document.getElementById('pw-confirm').value;
    errEl.textContent = '';
    if(!current||!newPw||!confirmPw){errEl.textContent='All fields are required.';return;}
    if(newPw.length<6){errEl.textContent='New password must be at least 6 characters.';return;}
    if(newPw!==confirmPw){errEl.textContent='New passwords do not match.';return;}
    ev.target.disabled=true;ev.target.textContent='Updating...';
    var check = await sb.auth.signInWithPassword({email:state.user.email, password:current});
    if(check.error){ev.target.disabled=false;ev.target.textContent='Update password';errEl.textContent='Current password is incorrect.';return;}
    var result = await sb.auth.updateUser({password:newPw});
    ev.target.disabled=false;ev.target.textContent='Update password';
    if(result.error){errEl.textContent='Update failed: '+result.error.message;return;}
    removeModal('pw-modal');
    state.flash='Password updated successfully.';
    render();
  };
}

async function renderHours(){
  var tc = document.getElementById('tc');
  var fs = state.fnStart;
  var weekKey = isoDate(fs);
  var weekEndKey = isoDate(addDays(fs,6));
  var results = await Promise.all([
    sb.from('roster').select('*').eq('week_start',weekKey),
    sb.from('timesheet_entries').select('*').eq('staff_id',state.profile.id).gte('work_date',weekKey).lte('work_date',weekEndKey)
  ]);
  if(results[0].error||results[1].error){tc.innerHTML='<div class="error">Could not load.</div>';return;}
  var rmap={};results[0].data.forEach(function(r){if(r.staff_id===state.profile.id)rmap[r.day_of_week]={location:r.location,start_time:t5(r.start_time)||'08:30',end_time:t5(r.end_time)||'17:00'};});
  var hmap={};results[1].data.forEach(function(h){hmap[h.work_date]=h;});
  var html='<div class="fn-nav"><button class="btn btn-icon" id="prev-wk">&#8249;</button><span class="fn-label">Pay week  Wed '+fmtDate(fs)+' to Tue '+fmtDate(addDays(fs,6))+'</span><button class="btn btn-icon" id="next-wk">&#8250;</button><button class="btn" id="this-wk" style="margin-left:auto;">This week</button></div>';
  html+='<div class="card scroll-x"><table class="tbl"><thead><tr><th style="width:100px;">Day</th><th style="width:120px;">Location</th><th style="width:90px;">Start</th><th style="width:90px;">End</th><th style="width:80px;">Break (min)</th><th style="width:70px;">Total</th><th>Notes</th></tr></thead><tbody>';
  var wt=0;
  DAYS.forEach(function(day,i){
    var date=addDays(fs,DAY_OFFSETS[i]);var dKey=isoDate(date);var h=hmap[dKey]||{};var ros=rmap[day];var sl=ros?ros.location:'';
    var start=h.start_time||(sl?ros.start_time:'');var end=h.end_time||(sl?ros.end_time:'');var brk=h.break_minutes!=null?h.break_minutes:(sl?30:0);var tot=hoursBetween(start,end,brk);wt+=tot;
    var locOpts='<option value="">--</option>';LOCATIONS.forEach(function(l){locOpts+='<option value="'+l+'"'+((h.location||sl)===l?' selected':'')+'>'+l+'</option>';});
    html+='<tr data-day="'+dKey+'"><td>'+day+'<div style="font-size:11px;color:var(--text-muted);">'+fmtDate(date)+'</div></td><td><select class="hrs-loc">'+locOpts+'</select></td><td><input class="hrs-start" type="time" value="'+start+'"/></td><td><input class="hrs-end" type="time" value="'+end+'"/></td><td><input class="hrs-break" type="number" min="0" max="180" value="'+brk+'"/></td><td class="hrs-total" style="font-weight:700;">'+tot.toFixed(2)+'</td><td><input class="hrs-notes" type="text" value="'+esc(h.notes||'')+'" placeholder="optional"/></td></tr>';
  });
  html+='</tbody></table><div style="display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;"><div style="flex:1;min-width:140px;background:var(--accent-light);border-radius:var(--radius);padding:12px;"><div style="font-size:12px;color:var(--accent-dark);font-weight:600;">This pay week total</div><div style="font-size:24px;font-weight:700;color:var(--accent-dark);" id="week-total">'+wt.toFixed(2)+' hrs</div></div><button class="btn btn-primary" id="save-hours">Save timesheet</button><button class="btn" id="export-csv">Download Xero CSV (fortnight)</button></div></div>';
  tc.innerHTML=html;
  document.getElementById('prev-wk').onclick=function(){state.fnStart=addDays(state.fnStart,-7);renderHours();};
  document.getElementById('next-wk').onclick=function(){state.fnStart=addDays(state.fnStart,7);renderHours();};
  document.getElementById('this-wk').onclick=function(){state.fnStart=getFortnightStart(new Date());renderHours();};
  function recalc(){var t=0;document.querySelectorAll('tbody tr').forEach(function(tr){var s=tr.querySelector('.hrs-start').value;var e=tr.querySelector('.hrs-end').value;var b=parseInt(tr.querySelector('.hrs-break').value)||0;var v=hoursBetween(s,e,b);tr.querySelector('.hrs-total').textContent=v.toFixed(2);t+=v;});document.getElementById('week-total').textContent=t.toFixed(2)+' hrs';}
  document.querySelectorAll('.hrs-start,.hrs-end,.hrs-break').forEach(function(el){el.oninput=recalc;});
  document.getElementById('save-hours').onclick=async function(ev){
    ev.target.disabled=true;ev.target.textContent='Saving...';
    var ro=[];document.querySelectorAll('tbody tr').forEach(function(tr){ro.push({staff_id:state.profile.id,work_date:tr.dataset.day,location:tr.querySelector('.hrs-loc').value||null,start_time:tr.querySelector('.hrs-start').value||null,end_time:tr.querySelector('.hrs-end').value||null,break_minutes:parseInt(tr.querySelector('.hrs-break').value)||0,notes:tr.querySelector('.hrs-notes').value||null,updated_at:new Date().toISOString()});});
    var r=await sb.from('timesheet_entries').upsert(ro,{onConflict:'staff_id,work_date'});

    if(r.error){state.error='Save failed: '+r.error.message;render();return;}
    state.flash='Timesheet saved.';render();
  };
  document.getElementById('export-csv').onclick=async function(){
    var fnStart=isoDate(getFortnightStart(fs));
    var fnEnd=isoDate(addDays(getFortnightStart(fs),13));
    var r=await sb.from('timesheet_entries').select('*').eq('staff_id',state.profile.id).gte('work_date',fnStart).lte('work_date',fnEnd);
    var csv='EmployeeName,Date,EarningsRate,Location,StartTime,EndTime,BreakMinutes,TotalHours,Notes\n';
    (r.data||[]).forEach(function(h){var t=hoursBetween(h.start_time,h.end_time,h.break_minutes);if(t>0)csv+='"'+state.profile.name+'","'+h.work_date+'","Ordinary Hours","'+(h.location||'')+'","'+(h.start_time||'')+'","'+(h.end_time||'')+'","'+(h.break_minutes||0)+'","'+t.toFixed(2)+'","'+(h.notes||'').replace(/"/g,'""')+'"\n';});
    downloadCsv(csv,'timesheet_'+state.profile.name.replace(/\s+/g,'_').toLowerCase()+'_fortnight_'+fnStart+'.csv');
  };
}

  tc.innerHTML=html;
  function syncRows(){var t=document.getElementById('req-type').value;document.getElementById('req-loc-row').style.display=(t==='location'||t==='roster')?'flex':'none';document.getElementById('req-swap-row').style.display=t==='swap'?'flex':'none';}
  document.getElementById('req-type').onchange=syncRows;syncRows();
  document.getElementById('req-submit').onclick=async function(ev){
    var type=document.getElementById('req-type').value;var from=document.getElementById('req-from').value;var to=document.getElementById('req-to').value||from;var reason=document.getElementById('req-reason').value.trim();
    if(!from){state.error='Please choose a from-date.';render();return;}
    ev.target.disabled=true;
    var ins=await sb.from('requests').insert({staff_id:state.profile.id,type:type,from_date:from,to_date:to||null,reason:reason||null,location:(type==='location'||type==='roster')?document.getElementById('req-loc').value:null,swap_with:type==='swap'?document.getElementById('req-swap').value||null:null});
    ev.target.disabled=false;if(ins.error){state.error='Submit failed: '+ins.error.message;render();return;}
    state.flash='Request submitted.';render();
  };
}

// ════════ LOGIN ════════
function renderLogin(){
  userbox.innerHTML='';
  root.innerHTML='<div class="login-wrap"><div class="card"><p class="brand-title" style="margin-bottom:4px;">Sign in</p><p class="brand-sub" style="margin-bottom:18px;">Sign in to your account.</p><div class="row"><label class="label">Email</label><input id="li-email" class="input" type="email" autocomplete="username" style="flex:1;min-width:180px;"/></div><div class="row"><label class="label">Password</label><div class="pw-wrap"><input id="li-pass" class="input" type="password" autocomplete="current-password"/><button type="button" id="li-pass-toggle" class="pw-toggle" tabindex="-1">Show</button></div></div><div id="li-err" style="color:var(--danger);font-size:13px;margin:6px 0 12px;min-height:18px;"></div><button class="btn btn-primary" id="li-btn" style="width:100%;padding:12px;">Sign in</button><p style="font-size:12px;color:var(--text-faint);margin-top:18px;text-align:center;">Use the Change password option after signing in to update your password.</p></div></div>';
  var btn=document.getElementById('li-btn');
  var submit=async function(){var email=document.getElementById('li-email').value.trim();var pass=document.getElementById('li-pass').value;var err=document.getElementById('li-err');err.textContent='';if(!email||!pass){err.textContent='Email and password required.';return;}btn.disabled=true;btn.textContent='Signing in...';var r=await sb.auth.signInWithPassword({email:email,password:pass});btn.disabled=false;btn.textContent='Sign in';if(r.error){err.textContent=r.error.message;return;}await loadSession(r.data.user);};
  btn.onclick=submit;document.getElementById('li-pass').onkeydown=function(e){if(e.key==='Enter')submit();};
  document.getElementById('li-pass-toggle').onclick=function(){var inp=document.getElementById('li-pass');if(inp.type==='password'){inp.type='text';this.textContent='Hide';}else{inp.type='password';this.textContent='Show';}};
}
init();
</script>
